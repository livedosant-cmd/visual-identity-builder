name: Extract unit thumbnails

on:
  push:
    paths:
      - 'src/assets/**'
      - '.github/workflows/extract-unit-thumbnails.yml'
  workflow_dispatch:

jobs:
  extract:
    if: "!contains(github.event.head_commit.message, '[skip unit thumbnails]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Find unit pages
        shell: bash
        run: |
          set -e
          PDF=$(find src/assets -maxdepth 1 -type f -iname '*.pdf' | head -n 1)
          mkdir -p /tmp/unit-pages src/assets/unidades
          : > /tmp/matches.txt
          PAGES=$(pdfinfo "$PDF" | awk '/^Pages:/ {print $2}')
          for p in $(seq 1 "$PAGES"); do
            txt=$(pdftotext -f "$p" -l "$p" -layout "$PDF" - 2>/dev/null || true)
            for u in 204 205 206 207 304 305 306 307; do
              if printf '%s\n' "$txt" | grep -Eq "(^|[^0-9])$u([^0-9]|$)"; then
                printf '%s %s\n' "$u" "$p" >> /tmp/matches.txt
              fi
            done
          done
          sort -u /tmp/matches.txt > src/assets/unidades/unit-pages.txt
          cat src/assets/unidades/unit-pages.txt

      - name: Render first matching page for each unit
        shell: bash
        run: |
          set -e
          PDF=$(find src/assets -maxdepth 1 -type f -iname '*.pdf' | head -n 1)
          while read -r unit page; do
            [ -n "$unit" ] || continue
            [ -f "src/assets/unidades/unidade-$unit.png" ] && continue
            pdftoppm -png -r 120 -f "$page" -singlefile "$PDF" "src/assets/unidades/unidade-$unit"
          done < src/assets/unidades/unit-pages.txt

      - name: Commit thumbnails
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/unidades
          git diff --cached --quiet && exit 0
          git commit -m "add unit thumbnails [skip unit thumbnails]"
          git push
